# =============================================================================
# SafeNet Service Monitoring
# =============================================================================
# Purpose: Monitor critical SafeNet services, auto-restart on failure
# Location: /etc/monit/conf.d/safenet-services
#
# Services monitored:
# - WireGuard VPN tunnel (wg0 interface)
# - Unbound DNS resolver
# - nginx web server
# - Netdata monitoring dashboard
# - ntfy push notifications
# - fail2ban brute force protection
#
# All alerts sent via ntfy to OSS engineers.
# Auto-restart attempted before escalating to manual intervention.
# =============================================================================

# --- WireGuard VPN (kernel interface, not a process) ---
check program wireguard with path "/bin/bash -c 'ip link show wg0 | grep -q UP'"
    if status != 0 then exec "/usr/local/bin/monit-ntfy-alert" "WireGuard DOWN" "WireGuard tunnel wg0 is not UP!" "urgent" "rotating_light"

# --- Unbound DNS ---
check process unbound matching "/usr/sbin/unbound"
    start program = "/usr/bin/systemctl start unbound"
    stop program = "/usr/bin/systemctl stop unbound"
    if does not exist then exec "/usr/local/bin/monit-ntfy-alert" "DNS DOWN" "Unbound DNS not running!" "urgent" "rotating_light"
    if does not exist for 2 cycles then restart
    if 3 restarts within 5 cycles then exec "/usr/local/bin/monit-ntfy-alert" "DNS CRITICAL" "Unbound keeps crashing - manual intervention needed!" "urgent" "skull"

# --- nginx Web Server ---
check process nginx with pidfile /run/nginx.pid
    start program = "/usr/bin/systemctl start nginx"
    stop program = "/usr/bin/systemctl stop nginx"
    if does not exist then exec "/usr/local/bin/monit-ntfy-alert" "nginx DOWN" "Web server not responding!" "high" "warning"
    if does not exist for 2 cycles then restart
    if 3 restarts within 5 cycles then exec "/usr/local/bin/monit-ntfy-alert" "nginx CRITICAL" "nginx keeps crashing!" "urgent" "skull"

# --- Netdata Monitoring ---
check process netdata matching "/usr/sbin/netdata"
    start program = "/usr/bin/systemctl start netdata"
    stop program = "/usr/bin/systemctl stop netdata"
    if does not exist then exec "/usr/local/bin/monit-ntfy-alert" "Netdata DOWN" "Monitoring dashboard offline!" "default" "chart_with_downwards_trend"
    if does not exist for 3 cycles then restart

# --- ntfy Notifications ---
check process ntfy matching "/usr/bin/ntfy"
    start program = "/usr/bin/systemctl start ntfy"
    stop program = "/usr/bin/systemctl stop ntfy"
    if does not exist then restart
    if 3 restarts within 5 cycles then exec "/usr/local/bin/monit-ntfy-alert" "ntfy CRITICAL" "Push notifications failing!" "urgent" "bell"

# --- fail2ban Security ---
check process fail2ban matching "fail2ban-server"
    start program = "/usr/bin/systemctl start fail2ban"
    stop program = "/usr/bin/systemctl stop fail2ban"
    if does not exist then exec "/usr/local/bin/monit-ntfy-alert" "fail2ban DOWN" "Brute force protection offline!" "high" "shield"
    if does not exist for 2 cycles then restart
