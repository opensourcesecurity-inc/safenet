# =============================================================================
# SafeNet Security Monitoring
# =============================================================================
# Purpose: Detect security-relevant events
# Location: /etc/monit/conf.d/safenet-security
#
# Monitors for:
# - Root SSH login attempts (alerts via ntfy)
#
# Uses custom check script at /usr/local/bin/check-root-login
# that tracks state to only alert on NEW logins (not repeat alerts).
# =============================================================================

# --- Root Login Detection (smart - only NEW logins) ---
check program root_login with path "/usr/local/bin/check-root-login"
    every 2 cycles
    if status = 1 then alert
