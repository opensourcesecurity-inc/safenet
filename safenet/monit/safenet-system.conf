# =============================================================================
# SafeNet System Resource Monitoring
# =============================================================================
# Purpose: Monitor CPU, memory, disk, and network health
# Location: /etc/monit/conf.d/safenet-system
#
# Thresholds tuned for SafeNet server specs:
# - CPU: Xeon E3-1230 v6 (4C/8T)
# - RAM: 32GB DDR4
# - Disk: 250GB SSD
# - Network: 10Gbps fiber
#
# Alerts escalate from warning to critical based on severity and duration.
# =============================================================================

# --- CPU Usage ---
check system $HOST
    if loadavg (5min) > 4 then exec "/usr/local/bin/monit-ntfy-alert" "High CPU Load" "5-min load average above 4" "high" "fire"
    if loadavg (15min) > 3 then exec "/usr/local/bin/monit-ntfy-alert" "Sustained CPU Load" "15-min load average above 3 - investigate!" "high" "warning"
    if cpu usage > 90% for 5 cycles then exec "/usr/local/bin/monit-ntfy-alert" "CPU Critical" "CPU over 90% for 5+ minutes!" "urgent" "rotating_light"
    if memory usage > 85% then exec "/usr/local/bin/monit-ntfy-alert" "High Memory" "RAM usage above 85%" "high" "warning"
    if memory usage > 95% then exec "/usr/local/bin/monit-ntfy-alert" "Memory Critical" "RAM usage above 95%!" "urgent" "rotating_light"

# --- Disk Space ---
check filesystem rootfs with path /
    if space usage > 80% then exec "/usr/local/bin/monit-ntfy-alert" "Disk Warning" "Root filesystem above 80%" "high" "file_folder"
    if space usage > 90% then exec "/usr/local/bin/monit-ntfy-alert" "Disk Critical" "Root filesystem above 90%!" "urgent" "rotating_light"
    if inode usage > 80% then exec "/usr/local/bin/monit-ntfy-alert" "Inode Warning" "Inodes above 80%" "high" "warning"

# --- Network Interface ---
check network nic1 with interface nic1
    if failed link then exec "/usr/local/bin/monit-ntfy-alert" "Network DOWN" "Primary network interface nic1 lost link!" "urgent" "electric_plug"
    if saturation > 90% then exec "/usr/local/bin/monit-ntfy-alert" "Network Saturated" "nic1 above 90% capacity" "high" "warning"
