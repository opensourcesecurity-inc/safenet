# =============================================================================
# SafeNet Unbound DNS Configuration
# =============================================================================
# Purpose: DNS resolver for SafeNet VPN clients
# Location: /etc/unbound/unbound.conf.d/safenet.conf
# 
# This configuration:
# - Listens ONLY on the WireGuard tunnel interface (10.200.0.1)
# - Restricts access to SafeNet clients only (10.200.0.0/24)
# - Forwards to Cloudflare and Google DNS
# - Hides server identity for privacy
#
# ZERO QUERY LOGGING - We cannot see what domains customers resolve.
# This is verifiable: no log directives, verbosity not set (defaults to 0).
#
# See AIW Part 19 for full SafeNet architecture.
# =============================================================================

server:
    interface: 10.200.0.1
    access-control: 10.200.0.0/24 allow
    do-ip6: no
    hide-identity: yes
    hide-version: yes

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
