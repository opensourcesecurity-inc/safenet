# =============================================================================
# SafeNet Streaming Service Blocks
# =============================================================================
# Purpose: Enforce browse-only policy by blocking streaming CDNs at DNS level
# Location: /etc/unbound/unbound.conf.d/streaming-blocks.conf
#
# SafeNet is a browsing-focused VPN, not for streaming. These blocks:
# - Prevent bandwidth abuse (streaming saturates shared infrastructure)
# - Align with Terms of Service (browse-only)
# - Return NXDOMAIN (domain doesn't exist) for blocked services
#
# Note: Regular YouTube is NOT blocked - only YouTube TV.
# This is DNS-layer enforcement; iptables provides protocol-layer enforcement.
#
# See AIW Part 19 for full policy details.
# =============================================================================

server:
    # Netflix
    local-zone: "netflix.com" refuse
    local-zone: "nflxvideo.net" refuse
    local-zone: "nflxext.com" refuse
    local-zone: "nflximg.net" refuse
    local-zone: "nflxso.net" refuse
    local-zone: "netflix.net" refuse

    # Hulu
    local-zone: "hulu.com" refuse
    local-zone: "hulustream.com" refuse
    local-zone: "huluim.com" refuse

    # Disney+
    local-zone: "disneyplus.com" refuse
    local-zone: "bamgrid.com" refuse
    local-zone: "dssott.com" refuse
    local-zone: "disney-plus.net" refuse

    # HBO Max
    local-zone: "hbomax.com" refuse
    local-zone: "hbonow.com" refuse
    local-zone: "hbogo.com" refuse

    # Amazon Prime Video
    local-zone: "primevideo.com" refuse
    local-zone: "amazonvideo.com" refuse
    local-zone: "pv-cdn.net" refuse

    # Paramount+
    local-zone: "paramountplus.com" refuse
    local-zone: "cbsi.com" refuse
    local-zone: "cbsivideo.com" refuse

    # Peacock
    local-zone: "peacocktv.com" refuse

    # Apple TV+
    local-zone: "tv.apple.com" refuse

    # YouTube TV (NOT regular YouTube)
    local-zone: "tv.youtube.com" refuse
    local-zone: "youtubetv.com" refuse
